name: Build APK (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat scaffold Android (jika belum ada)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.rexxin --project-name chess_rexxin --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="Chess Rexxin"/' android/app/src/main/AndroidManifest.xml

      - name: Pastikan tidak ada abiFilters yang membatasi
        run: |
          grep -rn "abiFilters" android/app/build.gradle* || echo "Tidak ada abiFilters, armeabi-v7a aman"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK ARM 32-bit
        run: flutter build apk --release --target-platform android-arm

      - uses: actions/upload-artifact@v4
        with:
          name: chess-rexxin-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-release.apk
